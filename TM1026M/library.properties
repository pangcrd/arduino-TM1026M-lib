sentence=Arduino driver for the BIOSEC TM1026M fingerprint module with per-MCU UART auto-select.
paragraph=Implements the Tuzheng 8-byte F5 protocol: fast handshake init, power management per the datasheet, enroll, 1:1/1:N match, user management, template up/download and touch wake-up. The UART port and default pins are chosen automatically for ESP32/ESP32-S2/S3/C3/S31, ESP8266, AVR, STM32, RP2040 and more, with manual override.
